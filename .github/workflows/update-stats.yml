name: Update GitHub Stats

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Fetch stats card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api?username=Stanislas-Poisson&show_icons=true&theme=default&hide_title=true" -o assets/stats.svg.new

      - name: Fetch top languages card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=Stanislas-Poisson&layout=compact&hide_title=true" -o assets/top-langs.svg.new

      - name: Validate and replace stats card
        run: |
          if grep -q "<svg" assets/stats.svg.new; then
            mv assets/stats.svg.new assets/stats.svg
          else
            echo "Stats card fetch failed or returned invalid content, keeping previous version."
            rm -f assets/stats.svg.new
          fi

      - name: Validate and replace top languages card
        run: |
          if grep -q "<svg" assets/top-langs.svg.new; then
            mv assets/top-langs.svg.new assets/top-langs.svg
          else
            echo "Top languages card fetch failed or returned invalid content, keeping previous version."
            rm -f assets/top-langs.svg.new
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stats cards"
          git push
