name: Update stats

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_USERNAME: Stanislas-Poisson
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python .github/generate_stats.py

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: mise à jour automatique des stats [skip ci]"
          git push
